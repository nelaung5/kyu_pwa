[project]
name = "kyu_pwa"
authors = [
    { name = "Kyu Terra" }
]
description = "Kyu Terra PWA customizations for Frappe applications"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
